<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <path id="textCircleOuter" d="M 100, 100 m -78, 0 a 78,78 0 1,1 156,0 a 78,78 0 1,1 -156,0" />
    <path id="textCircleInner" d="M 100, 100 m -58, 0 a 58,58 0 1,1 116,0 a 58,58 0 1,1 -116,0" />
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="100" cy="100" r="68" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
  
  <!-- Outer Arch Text -->
  <text font-family="'Times New Roman', Georgia, serif" font-size="11" font-weight="bold" fill="#1E3A8A" letter-spacing="2.5">
    <textPath href="#textCircleOuter" startOffset="50%" text-anchor="middle">
      UNIVERSITY OF EXCELLENCE &amp; SCIENCE
    </textPath>
  </text>
  
  <text font-family="'Times New Roman', Georgia, serif" font-size="9" font-weight="600" fill="#2563EB" letter-spacing="3">
    <textPath href="#textCircleInner" startOffset="50%" text-anchor="middle">
      • EST. 1892 • VERITAS ET VIRTUS •
    </textPath>
  </text>
  
  <!-- Center Emblem: Torch & Open Book -->
  <g transform="translate(100, 105)">
    <!-- Open Book -->
    <path d="M-28 6 C-14 2, -4 4, 0 8 C4 4, 14 2, 28 6 L28 -12 C14 -16, 4 -14, 0 -10 C-4 -14, -14 -16, -28 -12 Z" fill="#EEF2F6" stroke="#1E3A8A" stroke-width="2"/>
    <path d="M0 -10 L0 8" stroke="#1E3A8A" stroke-width="1.5"/>
    <path d="M-22 -5 C-14 -7, -6 -6, -2 -4" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
    <path d="M-22 0 C-14 -2, -6 -1, -2 1" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
    <path d="M22 -5 C14 -7, 6 -6, 2 -4" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
    <path d="M22 0 C14 -2, 6 -1, 2 1" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Torch Flame -->
    <path d="M0 -14 C-4 -22, -8 -26, 0 -38 C8 -26, 4 -22, 0 -14 Z" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>
    <path d="M0 -18 C-2 -23, -4 -25, 0 -31 C4 -25, 2 -23, 0 -18 Z" fill="#FEF3C7"/>
    
    <!-- Laurel Wreath -->
    <path d="M-36 12 C-42 -2, -38 -20, -22 -32" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M36 12 C42 -2, 38 -20, 22 -32" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-32" cy="-8" r="2" fill="#2563EB"/>
    <circle cx="-27" cy="-20" r="2" fill="#2563EB"/>
    <circle cx="32" cy="-8" r="2" fill="#2563EB"/>
    <circle cx="27" cy="-20" r="2" fill="#2563EB"/>
  </g>
</svg>
